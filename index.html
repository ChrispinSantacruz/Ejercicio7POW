<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda y Filtrado de Posts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Filtrar Posts</h1> <!-- Título principal de la página -->
    </header>

    <!-- Contenedor de filtros -->
    <div class="filters">
        <!-- Input para búsqueda por título o cuerpo -->
        <input type="text" id="searchInput" placeholder="Buscar por título o cuerpo">
        <!-- Dropdown para seleccionar un usuario -->
        <select id="userDropdown">
            <option value="">Selecciona un usuario</option> <!-- Opción predeterminada -->
        </select>
    </div>

    <!-- Indicador de carga -->
    <div id="loading">Cargando...</div>
    <!-- Mensaje de error en caso de fallos al cargar los datos -->
    <div id="error" style="display: none;">Error al cargar los datos</div>

    <!-- Contenedor para los posts filtrados -->
    <div id="postsContainer"></div>

    <script src="app.js"></script>
</body>
</html>
